# Builds the static frontend and deploys the blazz-portfolio Worker (blazz.cl).
# Runs on every push to main and on demand.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install locked frontend and Worker dependencies
        run: |
          npm ci
          npm --prefix worker ci
      - name: Units and types
        run: |
          npm run test:unit
          npm run typecheck
          npm --prefix worker run typecheck
          npm --prefix worker run test:api
      - name: Build static frontend
        run: npm run build
      - name: Deploy Worker
        working-directory: worker
        run: ./node_modules/.bin/cloudflare deploy
        env:
          CF_SEND_TELEMETRY: 'false'
          DO_NOT_TRACK: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
